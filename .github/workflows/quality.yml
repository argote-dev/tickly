name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android-quality:
    name: Android quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Run Android quality gates
        run: scripts/quality-gates.sh android
      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-quality-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: warn

  ios-quality:
    name: iOS quality
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode 26.6
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer" >> "$GITHUB_ENV"
          else
            echo "Xcode 26.6 is required on the macos-26 runner." >&2
            exit 1
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36 for Gradle configuration
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Run iOS quality gates
        run: scripts/quality-gates.sh ios
      - name: Upload iOS reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-quality-reports
          path: |
            build/reports/xcodebuild-ios.log
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: warn
